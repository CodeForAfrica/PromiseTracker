packages:
  - apps/*
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: true
  lefthook: false

# One version of every dependency across the repository. Packages refer to
# these with "catalog:", and strict mode refuses any other version.
catalogMode: strict

