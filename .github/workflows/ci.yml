name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The official image includes the unaccent and pg_trgm extensions.
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: promisetracker
          POSTGRES_PASSWORD: promisetracker
          POSTGRES_DB: promisetracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U promisetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the core plugins, and no credentials for any outside service.
      # Files go to a local folder because S3_BUCKET is not set.
      DATABASE_URL: postgres://promisetracker:promisetracker@localhost:5432/promisetracker
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      PT_PLUGINS: core,site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations match the Payload config
        run: pnpm migrate:check
      - run: pnpm test:unit
      - run: pnpm test:int
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: codeforafrica/promisetracker-v3
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # Pull requests build the image to prove it builds. Only main publishes.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
